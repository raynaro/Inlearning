services:
  - type: web
    name: inlearning-riva
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@idat.edu.pe
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPERATIONAL_DEFAULT_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: inlearning-db
          property: connectionString

databases:
  - name: inlearning-db
    plan: free
    postgresMajorVersion: "18"
